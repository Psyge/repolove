<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="app.title">Aurora Tracker — Live Northern Lights Forecast</title>
  <meta name="description" content="Real-time aurora visibility forecast for Lapland. Live Kp index, solar wind data and probability calculator.">
  <meta property="og:title" content="Aurora Tracker">
  <meta property="og:description" content="Live northern lights forecast for Lapland.">
  <meta property="og:type" content="website">
  <link rel="canonical" href="https://your-domain.example/">
  <link rel="stylesheet" href="css/style.css?v=2.0.0">
</head>
<body>
  <header>
    <h1 data-i18n="app.title">Aurora Tracker</h1>
    <nav>
      <a href="/" data-i18n="nav.home">Home</a>
      <a href="/map.html" data-i18n="nav.map">Map</a>
      <a href="/faq.html" data-i18n="nav.faq">FAQ</a>
      <a href="/contact.html" data-i18n="nav.contact">Contact</a>
    </nav>
    <div class="lang-switcher">
      <button data-set-lang="en">🇬🇧 EN</button>
      <button data-set-lang="fi">🇫🇮 FI</button>
    </div>
  </header>

  <main class="container">
    <section class="kp-display">
      <p data-i18n="probability.label">Aurora probability</p>
      <h2><span data-probability>–</span></h2>
      <p>
        <span data-i18n="kp.label">Kp</span>: <span data-kp>–</span> ·
        <span data-i18n="wind.speed">Wind</span>: <span data-speed>–</span> ·
        <span data-i18n="bz.label">Bz</span>: <span data-bz>–</span>
      </p>
      <p data-error style="color:#ff6666;"></p>
    </section>

    <div class="ad-slot"><!-- AdSense slot 1 --></div>

    <section>
      <label for="search-input" data-i18n="search.placeholder">Search a city…</label>
      <input id="search-input" type="search"
             data-i18n-attr="placeholder:search.placeholder">
      <ul id="search-results"></ul>
    </section>

    <div class="ad-slot"><!-- AdSense slot 2 --></div>
  </main>

  <footer>
    <a href="/privacy.html" data-i18n="footer.privacy">Privacy</a> ·
    <a href="/about.html" data-i18n="footer.about">About</a>
  </footer>

  <!-- ===== Skriptit (järjestys tärkeä) ===== -->
  <script src="config.js?v=2.0.0"></script>
  <script src="js/i18n.js?v=2.0.0"></script>
  <script src="js/solar-wind.js?v=2.0.0"></script>
  <script src="js/aurora-engine.js?v=2.0.0"></script>
  <script src="js/search.js?v=2.0.0"></script>
  <script src="js/markers.js?v=2.0.0"></script>
  <script src="js/main.js?v=2.0.0"></script>
</body>
</html>
