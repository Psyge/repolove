<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="map.pagetitle">Live Aurora Map — Aurora Tracker</title>
  <meta name="description" content="Interactive live map of aurora viewing spots in Lapland with real-time weather and Kp index.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css?v=2.5.0">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
  <header>
    <div class="header-inner">
      <a href="index.html" class="brand">Aurora Tracker</a>
      <nav>
        <a href="index.html" data-i18n="nav.home">Home</a>
        <a href="map.html" data-i18n="nav.map">Map</a>
        <a href="blog.html" data-i18n="nav.blog">Articles</a>
        <a href="faq.html" data-i18n="nav.faq">FAQ</a>
      </nav>
      <div class="lang-switcher">
        <button data-set-lang="en">EN</button>
        <button data-set-lang="fi">FI</button>
      </div>
    </div>
  </header>

  <main class="container" style="padding: var(--space-md);">
    <div class="section-head">
      <div>
        <h2 data-i18n="map.title">Live Aurora Map</h2>
        <p>
          <span data-i18n="kp.label">Kp</span>: <strong data-kp>0</strong> ·
          <span data-i18n="probability.label">Aurora probability</span>: <strong data-probability>0%</strong>
        </p>
        <p style="color:var(--fg-dim);font-size:13px;margin-top:4px;" data-i18n="map.click_hint">Click anywhere on the map to see aurora probability</p>
      </div>
    </div>
    <div id="map"></div>

    <!-- Kelluva raportointinappi -->
    <button id="report-sighting-btn" class="btn-primary btn-report btn-report-floating" data-i18n="sightings.report_btn">I see auroras now</button>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="config.js?v=2.5.0"></script>
  <script src="js/i18n.js?v=2.5.0"></script>
  <script src="js/places.js?v=2.5.0"></script>
  <script src="js/weather.js?v=2.5.0"></script>
  <script src="js/solar-wind.js?v=2.5.0"></script>
  <script src="js/aurora-engine.js?v=2.5.0"></script>
  <script src="js/aurora-overlay.js?v=2.5.0"></script>
  <script src="js/sightings.js?v=2.5.2"></script>
  <script src="js/map-page.js?v=2.5.2"></script>
</body>
</html>
